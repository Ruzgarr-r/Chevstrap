name: CI (Debug)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Project
        run: ./gradlew build

      - name: Find Created Build Artifacts
        run: find . -maxdepth 5 -type f \( -name "*.apk" -o -name "*.jar" \)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chevstrap-Build
          path: |
            **/build/outputs/**/*.apk
            **/build/libs/*.jar
